<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청라돔 이전 & 구단 인프라 조성 업무관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --ink:#1b2130; --ink2:#465065; --mute:#8590a3; --line:#e2e6ee; --line2:#eef1f6;
  --bg:#f4f6fa; --card:#fff; --acc:#2f5bea; --acc-weak:#e9efff; --red:#d9342b; --red-weak:#fdecea;
  --green:#14834a; --green-weak:#e5f5ec; --amber:#b86e00; --amber-weak:#fff4de; --dark:#151a26;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:13px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:1600px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px}
.top .sub{color:#9aa4b8;font-size:11.5px}
.top .sp{flex:1}
.sync{font-size:11.5px;padding:4px 10px;border-radius:99px;background:#262d3d;color:#c9d1e0}
.sync.ok{background:#173a2a;color:#7fe0aa}.sync.warn{background:#4a3410;color:#ffd38a}
main{max-width:1600px;margin:0 auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:800}
.card-h .hint{color:var(--mute);font-size:11.5px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f6f8fb}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.xl{background:#1d7a46;border-color:#1d7a46;color:#fff}
.btn.ppt{background:#c4511c;border-color:#c4511c;color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:#eef1f6}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:none;background:none;color:#a2abbb;font-size:14px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--red);background:var(--red-weak)}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{border:1px solid #d5dbe5;border-radius:7px;padding:5px 8px;background:#fff;font-size:12.5px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--acc)}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef1f6;color:var(--ink2);white-space:nowrap}
.chip.g{background:var(--green-weak);color:var(--green)}.chip.a{background:var(--amber-weak);color:var(--amber)}
.chip.r{background:var(--red-weak);color:var(--red)}.chip.b{background:var(--acc-weak);color:var(--acc)}
.chip.d{background:var(--ink);color:#fff}
.muted{color:var(--mute)}
.empty{padding:28px;text-align:center;color:var(--mute);font-size:12.5px}

/* milestone */
.ms-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ms-wrap{overflow:auto;max-height:520px}
table.ms{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11.5px}
table.ms th,table.ms td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0}
table.ms thead th{position:sticky;background:#273044;color:#e8ecf4;font-weight:700;z-index:2}
table.ms thead tr:first-child th{top:0;height:28px}
table.ms thead tr:nth-child(2) th{top:28px;height:22px;background:#344058;font-weight:500;color:#c7cfdd;font-size:10.5px}
table.ms th.mend,table.ms td.mend{border-right:1px solid #cfd6e2}
table.ms thead th.mend{border-right-color:#4b5772}
table.ms th.now{background:var(--red)!important;color:#fff!important}
table.ms .sticky{position:sticky;left:0;z-index:3;background:#fff}
table.ms thead .sticky{z-index:4;background:#273044}
table.ms td.catc{padding:8px 12px;cursor:pointer;vertical-align:middle;border-right:2px solid var(--line)}
table.ms td.catc:hover{background:#f6f8fb}
table.ms td.catc.on{background:var(--acc-weak);box-shadow:inset 3px 0 0 var(--acc)}
.catc .nm{font-weight:800;font-size:12.5px}
.catc .meta{color:var(--mute);font-size:10.5px;margin-top:2px}
table.ms td.cell{height:34px;cursor:pointer}
table.ms td.cell:hover{background:#eef3ff}
table.ms td.cell.now{background:#fff5f4}
table.ms tr.grp td{border-bottom:2px solid #dde2ec}
td.barcell{padding:3px 2px!important;height:34px}
.bar{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;cursor:pointer;overflow:hidden;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.bar b{font-size:10px;background:rgba(0,0,0,.18);padding:1px 6px;border-radius:5px;flex:none}
.bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}.bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.legend{font-size:11px;color:var(--mute);padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.catcard{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:7px;transition:.12s}
.catcard:hover{border-color:#b9c6e4;transform:translateY(-1px)}
.catcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-weak)}
.catcard .t{display:flex;align-items:center;gap:6px}
.catcard .t b{font-size:14px;font-weight:800}
.catcard .subs{display:flex;gap:4px;flex-wrap:wrap}
.pbar{height:6px;border-radius:9px;background:#edf0f5;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.pbar.g i{background:var(--green)}
.catcard .now{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* workspace */
.ws{padding:16px}
.ws-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.ws-h h3{margin:0;font-size:18px;font-weight:800}
.ws-h .d{color:var(--mute);font-size:12px;margin-top:2px}
.seg{display:inline-flex;background:#eef1f6;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 14px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.big button{padding:9px 18px;font-size:13.5px}
.seg.big button.on{background:var(--ink);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 14px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 14px;font-weight:700;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .n{font-size:10.5px;background:#eef1f6;border-radius:9px;padding:0 6px;margin-left:4px;color:var(--ink2)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:12px;color:var(--ink2)}
.subtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.roombar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.roombar .lbl{font-size:11px;font-weight:800;color:var(--ink2);margin-right:4px}
.roombar button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.roombar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.form{display:grid;gap:8px;align-items:end;background:#f7f9fc;border:1px dashed #cfd7e5;border-radius:10px;padding:10px;margin-bottom:12px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:#f3f5f9;color:var(--ink2);font-weight:700;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:6px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:#fafbfd}
table.t td.c,table.t th.c{text-align:center}
table.t input[type=text],table.t input[type=number],table.t input[type=date],table.t select{border-color:transparent;background:transparent;width:100%;padding:3px 5px}
table.t input:hover,table.t select:hover{border-color:#d5dbe5;background:#fff}
table.t textarea{border-color:transparent;background:transparent;min-height:30px;padding:3px 5px;font-size:12px}
table.t textarea:hover{border-color:#d5dbe5;background:#fff}
tr.over td{background:#fff6f5}
.stat{font-weight:700;font-size:11.5px;border-radius:99px!important;padding:3px 8px!important;border:1px solid!important;width:auto!important}
.s-g{background:var(--green-weak)!important;color:var(--green);border-color:#bfe3cf!important}
.s-a{background:var(--amber-weak)!important;color:var(--amber);border-color:#f2d9a8!important}
.s-r{background:var(--red-weak)!important;color:var(--red);border-color:#f3c3bf!important}
.s-n{background:#f1f3f7!important;color:var(--ink2);border-color:#dfe3ea!important}
.s-b{background:var(--acc-weak)!important;color:var(--acc);border-color:#c7d5fb!important}
.ck{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:1000px){.grid2,.grid4{grid-template-columns:1fr}}
.kpi{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:11px;font-weight:700;color:var(--mute)}
.kpi .v{font-size:18px;font-weight:800}
.panel{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.panel>.ph{padding:9px 12px;border-bottom:1px solid var(--line);background:#f7f9fc;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px}
.panel>.pb{padding:10px 12px}
.log{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
.log .it{border-left:3px solid var(--acc);padding:4px 10px;background:#fafbfe;border-radius:0 8px 8px 0}
.log .it .m{font-size:10.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.log .it .tx{white-space:pre-wrap;font-size:12.5px}
.issue{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.issue.done .tx{text-decoration:line-through;color:var(--mute)}
.issue .tx{flex:1;white-space:pre-wrap}

/* flow */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin-bottom:14px}
@media (max-width:1100px){.flow{grid-template-columns:1fr}.flow .arr{transform:rotate(90deg);justify-self:center}}
.flow .st{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.flow .st:hover{border-color:#b9c6e4}
.flow .st .no{font-size:10.5px;font-weight:800;color:var(--acc)}
.flow .st .nm{font-weight:800;font-size:13.5px;margin:1px 0 6px}
.flow .st .ln{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.flow .st .ln b{color:var(--ink)}
.flow .arr{align-self:center;color:#a6b0c2;font-size:18px;font-weight:800}
.flow .st.end{background:#fbfcff;border-style:dashed}
.mx td .mini{display:flex;flex-direction:column;gap:3px;min-width:96px}
.mx td .mini .l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2)}

/* drawings */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.dcard .th{height:150px;background:#eef1f6 center/contain no-repeat;cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:800}
.dcard .bd{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.dcard .bd .t{font-weight:800;font-size:12.5px}
.room-sec{margin-bottom:16px}
.room-sec>h4{margin:0 0 8px;font-size:13px;display:flex;gap:6px;align-items:center}

/* layout editor */
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
@media (max-width:1100px){.lay{grid-template-columns:1fr}}
.canvas-box{border:1px solid var(--line);border-radius:10px;background:#2a3142;padding:10px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:auto}
.cv{position:relative;display:inline-block;user-select:none;touch-action:none;max-width:100%}
.cv img{display:block;max-width:100%;max-height:72vh;pointer-events:none;background:#fff}
.cv.rect,.cv.circle{cursor:crosshair}
.shp{position:absolute;border:2.5px solid var(--red);background:rgba(217,52,43,.14);cursor:move}
.shp.circle{border-radius:50%}
.shp.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--red)}
.shp .no{position:absolute;left:-2px;top:-2px;transform:translate(-50%,-50%);background:var(--red);color:#fff;font-weight:800;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}
.shp .lb{position:absolute;left:0;top:100%;margin-top:3px;background:rgba(21,26,38,.92);color:#fff;font-size:10.5px;line-height:1.3;padding:3px 6px;border-radius:5px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;border-left:3px solid var(--red)}
.shp .lb small{display:block;color:#c9d1e0;font-size:9.5px}
.nolabel .shp .lb{display:none}
.shp .rs{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;background:#fff;border:2px solid var(--red);border-radius:3px;cursor:nwse-resize}
.drawghost{position:absolute;border:2px dashed var(--red);background:rgba(217,52,43,.1);pointer-events:none}
.plist .it{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:flex-start}
.plist .it:hover{background:#fafbfd}.plist .it.on{background:#fff4f3}
.plist .num{background:var(--red);color:#fff;font-weight:800;font-size:10.5px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.snapbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.snapbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.snapbar button.on{background:var(--red);border-color:var(--red);color:#fff}
.dirty{color:var(--red);font-weight:800;font-size:11.5px}

/* renders */
.rcard{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:10px}
.rcard .rh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#f7f9fc;flex-wrap:wrap}
.rcard .rb{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:10px}
@media (max-width:900px){.rcard .rb{grid-template-columns:1fr}}
.imgbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#eef1f6}
.imgbox .cap{font-size:10.5px;font-weight:800;padding:4px 8px;background:#273044;color:#dfe5f0}
.imgbox .im{height:200px;background:#eef1f6 center/contain no-repeat;cursor:zoom-in}
.rimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:6px}
.rimgs .im{height:140px;border-radius:6px;background:#dde2ea center/cover no-repeat;cursor:zoom-in}

/* modal & toast */
.mbg{position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mdl.wide{max-width:900px}.mdl.xwide{max-width:1300px}
.mdl .mh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.mdl .mh b{font-size:14.5px;flex:1}
.mdl .mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mdl .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd3df}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--dark);color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);border-left:4px solid #47c483;max-width:380px}
.toast.warn{border-left-color:#f0b347}.toast.err{border-left-color:#f0625a}
.cmgr .it{display:grid;grid-template-columns:1fr 64px 140px auto;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px}
.rmgr .it{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.diff-new td{background:#effaf3!important}.diff-chg td{background:#fff8e8!important}
.banner{padding:8px 14px;border-radius:10px;font-size:12px;background:var(--amber-weak);color:#7a4c00;border:1px solid #f2d9a8}
.loading{padding:60px;text-align:center;color:var(--mute)}

/* page nav */
.pnav{display:flex;gap:4px;background:#262d3d;border-radius:10px;padding:3px;margin-left:18px}
.pnav button{border:none;background:none;color:#aeb7c8;font-weight:800;font-size:13.5px;padding:7px 18px;border-radius:8px}
.pnav button.on{background:#fff;color:var(--dark)}
/* summary */
.sum{display:grid;grid-template-columns:230px 1fr 210px;gap:16px;padding:14px 16px;align-items:center}
@media (max-width:1100px){.sum{grid-template-columns:1fr}}
.sum-main .k{font-size:12px;font-weight:800;color:var(--ink2)}
.sum-main .big{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.sum-main .big small{font-size:18px;margin-left:2px}
.pbar.lg{height:10px;margin:6px 0 4px}
.sum-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sum-cat{border:1px solid var(--line);background:#f9fafc;border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.sum-cat:hover{border-color:#b9c6e4}
.sum-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* gantt */

function readAsDataURL(blob){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
function mimeOf(file){
  if (file.type && /^(image\/(png|jpeg|gif|webp)|application\/pdf)$/.test(file.type)) return file.type;
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',pdf:'application/pdf'})[ext] || file.type;
}
async function uploadBlob(blob, type){
  if (Store.mode === 'shared') {
    if (!caps.assets) throw new Error('파일 업로드는 편집 권한(Editor 이상)이 있어야 합니다.');
    const r = await caps.assets.upload(blob, { type }); return r.id;
  }
  const id = 'local_' + uid(); localAssets[id] = await readAsDataURL(blob); return id;
}
const assetUrl = id => !id ? '' : id.startsWith('local_') ? (localAssets[id] || '') : '/_blob/' + id;
async function assetDataUrl(id){
  if (!id) return null;
  if (id.startsWith('local_')) return localAssets[id] || null;
  const r = await fetch(assetUrl(id)); if (!r.ok) return null; return await readAsDataURL(await r.blob());
}
function imgSize(src){ return new Promise(res => { const im = new Image(); im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = () => res({ w: 4, h: 3 }); im.src = src; }); }

async function pdfToPng(file){
  if (!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await pdf.getPage(1);
  const v0 = page.getViewport({ scale: 1 });
  const scale = Math.min(3, 2400 / Math.max(v0.width, v0.height));
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return await new Promise(r => c.toBlob(r, 'image/png'));
}
/* 도면 파일 하나를 올리고 {fileAsset, imageAsset, fileName, fileType} 반환. PDF는 1페이지를 이미지로 변환 시도 */
async function uploadDrawingFile(file){
  const type = mimeOf(file);
  if (!/^(image\/(png|jpeg|gif|webp)|application\/pdf)$/.test(type)) throw new Error('PNG/JPG/WEBP 이미지 또는 PDF만 올릴 수 있습니다.');
  const fileAsset = await uploadBlob(file, type);
  let imageAsset = type.startsWith('image/') ? fileAsset : null;
  if (type === 'application/pdf') {
    try { const png = await Promise.race([pdfToPng(file), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),25000))]); imageAsset = await uploadBlob(png, 'image/png'); }
    catch(e){ toast('PDF 미리보기 이미지 변환에 실패했습니다. 배치도에는 이미지 도면을 사용해주세요.', 'warn'); }
  }
  return { fileAsset, imageAsset, fileName: file.name, fileType: type };
}

function modal({ title, body, ok = '저장', cancel = '닫기', size = '', onOk, onOpen, left = '', okClass = 'pri' }){
  const wrap = document.createElement('div'); wrap.className = 'mbg';
  wrap.innerHTML = `<div class="mdl ${size}"><div class="mh"><b>${esc(title)}</b><button class="x" data-close>✕</button></div>
    <div class="mb">${body}</div>
    <div class="mf">${left}<div class="grow"></div>${cancel ? `<button class="btn" data-close>${esc(cancel)}</button>` : ''}${ok && onOk ? `<button class="btn ${okClass}" data-ok>${esc(ok)}</button>` : ''}</div></div>`;
  const close = () => wrap.remove();
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  wrap.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  const okb = wrap.querySelector('[data-ok]');
  if (okb) okb.onclick = async () => { okb.disabled = true; try { const r = await onOk(wrap); if (r !== false) close(); } finally { okb.disabled = false; } };
  $('#modals').appendChild(wrap);
  if (onOpen) onOpen(wrap, close);
  const f = wrap.querySelector('input[type=text],textarea'); if (f) setTimeout(()=>f.focus(), 30);
  return { el: wrap, close };
}

    <div class="row" style="align-items:flex-end">

      <label class="f" style="flex:1.6">유형<select id="tm-kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${k===cur.kind?'selected':''}>${v.name}</option>`).join('')}</select></label></div>
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:1.4"><span id="tm-ymlbl">시작 월</span><select id="tm-ym">${[...monthsOpt].sort().map(m=>`<option value="${m}" ${m===nYm(Math.floor(cur.abs/4))?'selected':''}>${ymLabel(m)}</option>`).join('')}</select></label>

    ${t ? `<div class="muted" style="font-size:11.5px">R&R 세부계획 ${pl.filter(p=>p.done).length}/${pl.length} 완료 · 진행률 ${pct(msProg(t))}% <a href="#rnr" onclick="event.preventDefault();openRR('${t.id}')">세부계획 편집 →</a></div>` : ''}`;
  let useColor = !!cur.color;

      const fillRows = sel => { const c = S.categories.find(x=>x.id===catSel.value), L = catLanes(c), opt = l => `<option value="${l.key}" ${l.key===sel?'selected':''}>${esc(l.label)}</option>`;

      fillRows(cur.row); catSel.onchange = () => fillRows('r:0');

        await safe(Promise.all([Store.del('ms_tasks', t.id), ...pl.map(p => Store.del('plans', p.id))]), '삭제했습니다.'); };
    },
    onOk: async el => {
      const v = s => el.querySelector(s).value;
      const kind = v('#tm-kind');
      const key = v('#tm-row'), isRoom = key.startsWith('room:');
      const data = { catId: v('#tm-cat'), row: isRoom ? -1 : Number(key.slice(2)), roomId: isRoom ? key.slice(5) : '', startYm: v('#tm-ym'), startWeek: Number(v('#tm-wk')), kind,

      if (!data.title) { toast('추진업무 내용을 입력하세요.', 'warn'); return false; }
      if (kind !== 'point') {
        const a = ymN(data.startYm)*4 + data.startWeek - 1, b = a + data.weeks - 1;
        const clash = S.ms_tasks.find(x => x.id !== taskId && x.kind !== 'point' && x.catId === data.catId && laneKey(x) === key && !(b < taskAbs(x) || a > taskEnd(x)));
        if (clash) { toast(`같은 행의 '${clash.title}'과(와) 기간이 겹칩니다. 다른 행을 선택하세요.`, 'warn'); return false; }
      }
      if (t) { const { id: _omit, ...rest } = t; await safe(Store.put('ms_tasks', t.id, Object.assign(rest, data)), '일정을 수정했습니다.'); }
      else await safe(Store.add('ms_tasks', data), '마일스톤에 반영했습니다.');
    } });
}
const CAT_TYPES = [['general','일반 프로젝트'],['space:clubhouse','공간관리 · 클럽하우스'],['space:office','공간관리 · 사무실(프런트)'],['space:moving','공간관리 · 이사(창고·지원)']];

        await safe(Promise.all([Store.del('categories', id), ...ts.map(t=>Store.del('ms_tasks', t.id)), ...pls.map(p=>Store.del('plans', p.id))]), '삭제했습니다.');
        if (ui.cat === id) go({ cat: null }); setTimeout(()=>draw(el), 150); };

    body: `<div class="muted" style="font-size:12px">행 이름은 쉼표로 구분합니다 (예: 업역 협의, 장비 반입, 사전 준비, 공사). ‘공간관리’ 유형은 실별 의사결정·도면·집기·인테리어 탭이 함께 열립니다.</div>
      <div class="cmgr" id="cm-list" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="form" style="grid-template-columns:1fr 1fr 2fr 190px auto;margin:0">

function rrMatch(t){

function exportRR(){

    if (!ps.length) rows.push({ '업무': c.name, '마일스톤': t.title, '기간': periodText(t), '마일스톤 진행률(%)': pct(msProg(t)), '세부계획': '', '책임자': '', '담당자': '', '기한': '', '완료': '', '완료일': '', '메모': '' });

  const people = {}; S.plans.forEach(p => { const add = (n, role) => { if (!n) return; people[n] = people[n] || { '이름': n, '책임 계획': 0, '담당 계획': 0, '미완료': 0 }; people[n][role]++; if (!p.done) people[n]['미완료']++; };

}

async function addIssue(catId){
  const text = $('#pi-text').value.trim(); if (!text) return toast('특이사항을 입력하세요.', 'warn');
  await safe(Store.add('proj_issues', { catId, text, status: '오픈', date: today() }), '특이사항을 기재했습니다.');
}
function exportProject(catId){
  const c = S.categories.find(x=>x.id===catId), p = S.projects.find(x=>x.id===catId) || {};
  const ts = S.ms_tasks.filter(t=>t.catId===catId && taskLive(t)).sort(sortTasks);
  const sheets = [
    ['개요', [{ '업무': c.name, '상위 구분': c.group||'', '상태': p.status||'진행중', '총괄 담당': p.owner||'', '데드라인': p.deadline||'', '진행률(%)': pct(catProg(catId)), '상세내용': p.summary||'' }]],
    ['마일스톤 R&R', ts.map(t => { const ppl = msPeople(t); return { '행': laneLabel(c,t), '마일스톤': t.title, '기간': periodText(t), '상태': ST_LABEL[msStatus(t)], '진행률(%)': pct(msProg(t)), '책임자': ppl.leads.join(', '), '실무자': ppl.staff.join(', ') }; })],
    ['세부계획', ts.flatMap(t => plansOf(t.id).map(x => ({ '마일스톤': t.title, '세부계획': x.title, '책임자': x.lead||'', '담당자': (x.staff||[]).join(', '), '기한': x.due||'', '완료': x.done?'O':'', '완료일': x.doneDate||'' })))],
    ['진행상황', S.proj_logs.filter(l=>l.catId===catId).sort(byDate).map(l=>({ '일자': l.date, '작성자': who(l.author), '내용': l.text }))],
    ['특이사항', S.proj_issues.filter(i=>i.catId===catId).map(i=>({ '등록일': i.date||'', '내용': i.text, '상태': i.status }))]
  ];
  if (c.type === 'space' && c.div === 'moving') sheets.push(['문학이전 집기', movingRows()]);
  exportXlsx(`${c.name}_프로젝트현황_${fileStamp()}.xlsx`, sheets);
}

/* 이사 ↔ 청라돔 집기 크로스체크 */
const DIVS = { clubhouse: '클럽하우스', office: '사무실(프런트 시설)', moving: '이사(창고·지원시설)' };
function movingRows(){
  return S.fixtures.filter(f=>f.source==='문학 이전').map(f=>({ '구분': DIVS[f.div]||'', '실': roomName(f.room), '집기명': f.name, '수량': Number(f.qty)||0, '문학 현위치': f.fromLoc||'', '이사 확인': f.moveChecked?'확인':'미확인', '청라 도면반영': f.drawing?'O':'', '비고': f.remark||'' }));
}
function renderMovingCross(){
  const list = S.fixtures.filter(f=>f.source==='문학 이전').sort((a,b)=>(a.div||'').localeCompare(b.div||'') || roomOrder(a.room)-roomOrder(b.room));
  const ok = list.filter(f=>f.moveChecked).length;
  return `<div class="bar2"><span class="muted" style="font-size:12px">클럽하우스·사무실·이사 공간의 ‘필요집기’에서 조달구분을 ‘문학 이전’으로 고른 항목이 자동으로 모입니다.</span><div class="grow"></div><span class="chip ${ok===list.length&&list.length?'g':'a'}">이사 확인 ${ok}/${list.length}</span>
      <button class="btn xl" onclick="exportXlsx('문학이전_집기_크로스체크_'+fileStamp()+'.xlsx',[['크로스체크',movingRows()]])">엑셀 내보내기</button></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>구분</th><th>청라 배치 실</th><th>집기명</th><th class="c">수량</th><th style="min-width:160px">문학 현위치</th><th class="c">청라 도면반영</th><th class="c">이사 확인</th><th style="min-width:140px">비고</th></tr></thead><tbody>
    ${list.map(f=>`<tr><td>${DIVS[f.div]||''}</td><td>${esc(roomName(f.room))}</td><td><b>${esc(f.name)}</b></td><td class="c">${esc(f.qty)}</td>
      <td><input type="text" value="${esc(f.fromLoc||'')}" placeholder="예: 문학 3층 프런트" onchange="upd('fixtures','${f.id}','fromLoc',this.value)"></td>
      <td class="c">${f.drawing?'<span class="chip g">반영</span>':'<span class="chip">-</span>'}</td>
      <td class="c"><input type="checkbox" class="ck" ${f.moveChecked?'checked':''} onchange="upd('fixtures','${f.id}','moveChecked',this.checked)"></td>
      <td><input type="text" value="${esc(f.remark||'')}" onchange="upd('fixtures','${f.id}','remark',this.value)"></td></tr>`).join('') || `<tr><td colspan="8" class="empty">아직 ‘문학 이전’으로 지정된 집기가 없습니다.</td></tr>`}
    </tbody></table></div>`;
}

/* =========================================================
   청라돔 이전 — 실(Room) 관리
   ========================================================= */
const roomsOf = div => S.rooms.filter(r=>r.div===div).sort(byOrder);
const roomName = id => id === '_all' ? '전체(공용)' : (S.rooms.find(r=>r.id===id)?.name || '(삭제된 실)');
const roomOrder = id => { const r = S.rooms.find(x=>x.id===id); return r ? (r.order ?? 0) : 999; };
const roomOpts = (div, sel, withAll) => (withAll ? `<option value="_all" ${sel==='_all'?'selected':''}>전체(공용)</option>` : '') + roomsOf(div).map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('');
const defRoom = div => (ui.room !== 'ALL' && S.rooms.some(r=>r.id===ui.room && r.div===div)) ? ui.room : (roomsOf(div)[0]?.id || '_all');
const inDiv = (arr, div) => arr.filter(x => x.div === div && (ui.room === 'ALL' || x.room === ui.room || x.room === '_all'));
function openRoomMgr(div){
  const draw = el => {
    const list = roomsOf(div);
    el.querySelector('#rm-list').innerHTML = list.map((r,i)=>`<div class="it" data-id="${r.id}"><input type="text" value="${esc(r.name)}">
      <div class="row" style="gap:2px"><button class="x" data-mv="-1" ${i===0?'disabled':''}>↑</button><button class="x" data-mv="1" ${i===list.length-1?'disabled':''}>↓</button><button class="x" data-del>🗑</button></div></div>`).join('') || '<div class="muted">등록된 실이 없습니다.</div>';
    el.querySelectorAll('#rm-list .it').forEach(it => { const id = it.dataset.id;
      it.querySelector('input').onchange = e => { if (e.target.value.trim()) safe(Store.upd('rooms', id, { name: e.target.value.trim() })); };
      it.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => { const L = roomsOf(div), i = L.findIndex(x=>x.id===id), j = i+Number(b.dataset.mv); if (j<0||j>=L.length) return;
        await safe(Promise.all(L.map((x,k)=>{ const o = k===i?j:k===j?i:k; return x.order===o?null:Store.upd('rooms', x.id, { order:o }); }))); setTimeout(()=>draw(el),120); });
      it.querySelector('[data-del]').onclick = async () => {
        const n = ['decisions','drawings','fixtures','layouts','interior_reqs','renders'].reduce((s,c)=>s+S[c].filter(x=>x.room===id).length,0);
        const mts = S.ms_tasks.filter(t=>t.roomId===id);
        if (!await confirmBox(`'${roomName(id)}' 실을 삭제할까요?${n?`\n이 실에 연결된 기록 ${n}건은 남지만 ‘(삭제된 실)’로 표시됩니다.`:''}${mts.length?`\n이 실의 마일스톤 ${mts.length}건은 함께 삭제됩니다.`:''}`)) return;
        await safe(Promise.all([Store.del('rooms', id), ...mts.map(t=>Store.del('ms_tasks', t.id))]), '삭제했습니다.'); if (ui.room === id) go({ room: 'ALL' }); setTimeout(()=>draw(el),150); };
    });
  };
  modal({ title: `${DIVS[div]} — 실 목록 관리`, ok: '', cancel: '완료', body: `<div class="muted" style="font-size:12px">실 이름을 바꿔도 기존 기록은 그대로 연결됩니다.</div><div class="rmgr" id="rm-list" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="row"><input type="text" id="rm-name" placeholder="새 실 이름 (예: 선수단 라커룸)" style="flex:1"><button class="btn dark" id="rm-add">추가</button></div>`,
    onOpen: el => { draw(el); const add = async () => { const n = el.querySelector('#rm-name').value.trim(); if (!n) return;
        await safe(Store.add('rooms', { div, name: n, order: roomsOf(div).length })); el.querySelector('#rm-name').value=''; setTimeout(()=>draw(el),150); };
      el.querySelector('#rm-add').onclick = add; el.querySelector('#rm-name').onkeydown = e => { if (e.key==='Enter') add(); }; } });
}

/* =========================================================
   공간관리 페이지 골격 (클럽하우스 / 사무실 / 이사)
   ========================================================= */
const CTABS = [['pm','프로젝트 관리'],['flow','워크플로우 현황'],['decision','실별 의사결정사항'],['drawing','도면 DB'],['fixture','실별 집기배치'],['interior','실별 인테리어상세계획']];
function renderCheongna(c){
  const div = DIVS[c.div] ? c.div : 'clubhouse';
  if (ui.div !== div) { ui.div = div; ui.room = 'ALL'; draft = null; }
  const tabs = div === 'moving' ? [...CTABS, ['cross','문학↔청라 크로스체크']] : CTABS;
  if (!tabs.some(([k]) => k === ui.tab)) ui.tab = 'pm';
  const rooms = roomsOf(div);
  if (ui.room !== 'ALL' && !rooms.some(r=>r.id===ui.room)) ui.room = 'ALL';
  const cnt = { decision: inDiv(S.decisions, div).filter(d=>d.status!=='완결').length, drawing: inDiv(S.drawings, div).length,
                fixture: inDiv(S.fixtures, div).length, interior: inDiv(S.interior_reqs, div).length,
                cross: S.fixtures.filter(f=>f.source==='문학 이전' && !f.moveChecked).length };
  let body = '';
  if (ui.tab === 'pm') body = projectPanel(c) + `<div class="panel" style="margin-top:14px"><div class="ph">${esc(DIVS[div])} 실 목록 <span class="chip">${rooms.length}실</span><span class="muted" style="font-weight:500">실 이름을 누르면 해당 실의 의사결정사항으로 이동</span><div class="grow"></div><button class="btn sm ghost" onclick="openRoomMgr('${div}')">실 추가·수정</button></div>
      <div class="pb"><ol class="rov-list wide">${rooms.map(r=>`<li onclick="goRoom('${c.id}','${r.id}')">${esc(r.name)}</li>`).join('') || '<li class="muted">등록된 실이 없습니다</li>'}</ol></div></div>`;
  else if (ui.tab === 'cross') body = renderMovingCross();
  else if (ui.tab === 'decision') body = tabDecision(div);
  else if (ui.tab === 'drawing') body = tabDrawing(div);
  else if (ui.tab === 'fixture') body = tabFixture(div);
  else if (ui.tab === 'interior') body = tabInterior(div);
  else body = tabFlow(div);
  const noRoomBar = ui.tab === 'pm' || ui.tab === 'cross' || (ui.tab === 'fixture' && ui.fxTab === 'layout');
  return `<div class="ws-h"><div>${c.group?`<div class="muted" style="font-size:11.5px">${esc(c.group)}</div>`:''}<h3>${esc(c.name)}</h3><div class="d">실별 요청사항 → 리스트업(인테리어·집기) → 도면 DB → 공사 구현 · 이사 크로스체크 흐름으로 관리합니다. · 공간 구분: ${esc(DIVS[div])} (${rooms.length}실)</div></div></div>
    <div class="tabs">${tabs.map(([k,v])=>`<button class="${ui.tab===k?'on':''}" onclick="go({tab:'${k}'})">${v}${cnt[k]?`<span class="n">${k==='decision'?'미결 ':k==='cross'?'미확인 ':''}${cnt[k]}</span>`:''}</button>`).join('')}</div>
    ${noRoomBar ? '' : `<div class="roombar"><span class="lbl">실 선택</span>
      <button class="${ui.room==='ALL'?'on':''}" onclick="go({room:'ALL'})">전체</button>
      ${rooms.map(r=>`<button class="${ui.room===r.id?'on':''}" onclick="go({room:'${r.id}'})">${esc(r.name)}</button>`).join('')}
      <div class="grow"></div><button class="btn sm ghost" onclick="openRoomMgr('${div}')">실 추가·수정</button></div>
      ${rooms.length ? '' : `<div class="banner" style="margin-bottom:12px">${DIVS[div]}에 등록된 실이 없습니다. ‘실 추가·수정’에서 실을 먼저 등록하세요.</div>`}`}
    ${body}`;
}

/* ---------- 워크플로우 현황 ---------- */
function tabFlow(div){
  const dec = inDiv(S.decisions, div), ir = inDiv(S.interior_reqs, div), fx = inDiv(S.fixtures, div);
  const dw = inDiv(S.drawings, div), ly = inDiv(S.layouts, div), rd = inDiv(S.renders, div);
  const items = [...ir, ...fx], mv = fx.filter(f=>f.source==='문학 이전');
  const c = (a,f) => a.filter(f).length;
  const flow = `<div class="flow">
    <div class="st" onclick="go({tab:'decision'})"><div class="no">STEP 1</div><div class="nm">실별 요청사항</div>
      <div class="ln"><span>의사결정 안건</span><b>${dec.length}</b></div><div class="ln"><span>미결</span><b style="color:var(--amber)">${c(dec,d=>d.status!=='완결')}</b></div><div class="ln"><span>리스트업 연계</span><b>${c(dec,d=>d.linkCol)}</b></div></div>
    <div class="arr">→</div>
    <div class="st" onclick="go({tab:'interior',inTab:'req'})"><div class="no">STEP 2 · 엑셀 리스트업</div><div class="nm">인테리어 · 집기</div>
      <div class="ln"><span>인테리어 요청 반영</span><b>${c(ir,x=>x.status==='반영완료')}/${ir.length}</b></div><div class="ln"><span>필요집기 반영</span><b>${c(fx,x=>x.reflected==='반영완료')}/${fx.length}</b></div><div class="ln"><span>설계사 스펙 이력</span><b>${S.spec_snaps.filter(s=>s.div===div).length}회</b></div></div>
    <div class="arr">→</div>
    <div class="st" onclick="go({tab:'drawing'})"><div class="no">STEP 3 · 도면 DB</div><div class="nm">도면 반영</div>
      <div class="ln"><span>도면 반영 항목</span><b>${c(items,x=>x.drawing)}/${items.length}</b></div><div class="ln"><span>도면 · 배치도 · 렌더</span><b>${dw.length} · ${ly.length} · ${rd.length}</b></div><div class="ln"><span>최신 도면</span><b>${esc(dw.map(d=>d.date).sort().pop()||'-')}</b></div></div>
    <div class="arr">→</div>
    <div class="st end"><div class="no">STEP 4</div><div class="nm">공사 구현 · 이사</div>
      <div class="ln"><span>공사 구현 확인</span><b>${c(items,x=>x.built)}/${items.length}</b></div><div class="ln"><span>문학 이전 집기 확인</span><b>${c(mv,x=>x.moveChecked)}/${mv.length}</b></div><div class="ln"><span class="muted">이사 확인은 ‘이사 → 크로스체크’ 탭</span><b></b></div></div>
  </div>`;
  const rooms = ui.room === 'ALL' ? roomsOf(div) : roomsOf(div).filter(r=>r.id===ui.room);
  const mini = (label, n, d) => `<div class="l"><span>${label}</span><b>${n}/${d}</b></div><div class="pbar ${d&&n===d?'g':''}"><i style="width:${d?Math.round(n/d*100):0}%"></i></div>`;
  const mx = rooms.map(r => {
    const D = S.decisions.filter(x=>x.div===div&&x.room===r.id), I = S.interior_reqs.filter(x=>x.div===div&&x.room===r.id), F = S.fixtures.filter(x=>x.div===div&&x.room===r.id);
    const last = col => S[col].filter(x=>x.div===div&&x.room===r.id).map(x=>x.date).sort().pop() || '-';
    return `<tr><td><b style="cursor:pointer" onclick="go({room:'${r.id}',tab:'decision'})">${esc(r.name)}</b></td>
      <td><div class="mini">${mini('완결', c(D,d=>d.status==='완결'), D.length)}</div></td>
      <td><div class="mini">${mini('반영', c(I,x=>x.status==='반영완료'), I.length)}${mini('도면', c(I,x=>x.drawing), I.length)}${mini('구현', c(I,x=>x.built), I.length)}</div></td>
      <td><div class="mini">${mini('반영', c(F,x=>x.reflected==='반영완료'), F.length)}${mini('도면', c(F,x=>x.drawing), F.length)}${mini('구현', c(F,x=>x.built), F.length)}</div></td>
      <td class="c">${c(F,x=>x.source==='문학 이전')}</td><td>${last('drawings')}</td><td>${last('layouts')}</td><td>${last('renders')}</td></tr>`; }).join('');
  return flow + `<div class="row" style="margin-bottom:8px"><b style="font-size:13px">실별 진행 매트릭스</b><span class="muted" style="font-size:11.5px">실 이름을 누르면 해당 실의 의사결정사항으로 이동</span><div class="grow"></div><button class="btn xl sm" onclick="exportFlow('${div}')">현황 엑셀</button></div>
    <div class="tbl-wrap mx"><table class="t"><thead><tr><th>실</th><th>의사결정</th><th>인테리어 (반영·도면·구현)</th><th>집기 (반영·도면·구현)</th><th class="c">문학 이전</th><th>최신 도면</th><th>최신 배치도</th><th>최신 렌더</th></tr></thead><tbody>${mx || '<tr><td colspan="8" class="empty">실을 등록하면 실별 현황이 표시됩니다.</td></tr>'}</tbody></table></div>`;
}
function exportFlow(div){
  const rows = roomsOf(div).map(r => { const f = col => S[col].filter(x=>x.div===div&&x.room===r.id);
    const D=f('decisions'), I=f('interior_reqs'), F=f('fixtures');
    return { '실': r.name, '의사결정(완결/전체)': `${D.filter(d=>d.status==='완결').length}/${D.length}`,
      '인테리어 반영': `${I.filter(x=>x.status==='반영완료').length}/${I.length}`, '인테리어 도면반영': `${I.filter(x=>x.drawing).length}/${I.length}`, '인테리어 구현': `${I.filter(x=>x.built).length}/${I.length}`,
      '집기 반영': `${F.filter(x=>x.reflected==='반영완료').length}/${F.length}`, '집기 도면반영': `${F.filter(x=>x.drawing).length}/${F.length}`, '집기 구현': `${F.filter(x=>x.built).length}/${F.length}`,
      '문학 이전 집기': F.filter(x=>x.source==='문학 이전').length }; });
  exportXlsx(`청라돔_${DIVS[div]}_워크플로우현황_${fileStamp()}.xlsx`, [['실별현황', rows]]);
}

/* ---------- 실별 의사결정사항 ---------- */
function tabDecision(div){
  let list = inDiv(S.decisions, div).sort((a,b)=>roomOrder(a.room)-roomOrder(b.room) || String(b.reqDate).localeCompare(String(a.reqDate)));
  if (ui.decOpen) list = list.filter(d=>d.status!=='완결');
  const all = inDiv(S.decisions, div), open = all.filter(d=>d.status!=='완결').length;
  return `<div class="bar2"><span class="chip">전체 ${all.length}</span><span class="chip a">미결 ${open}</span><span class="chip g">완결 ${all.length-open}</span>
      <label class="row" style="gap:4px;font-size:12px"><input type="checkbox" class="ck" ${ui.decOpen?'checked':''} onchange="go({decOpen:this.checked})">미결만 보기</label><div class="grow"></div>
      <button class="btn xl" onclick="exportDecisions('${div}')">엑셀 내보내기</button></div>

function linkCell(d){

async function addDecision(div){

async function toggleDec(id){ const d = S.decisions.find(x=>x.id===id); if (!d) return; const done = d.status !== '완결';

async function sendToList(id){

/* 설계사 제안스펙 */
const SPEC_KEYS = { room:['실','실명','실(구역)','구역','공간','room','실구분'], code:['코드','스펙코드','code','품번','도번','no.','기호'],
  name:['집기명','품목','품목명','품명','제안집기명','제안 집기명','item','가구명','명칭'], brand:['브랜드','제조사','제조사/브랜드','brand','메이커','업체'],
  spec:['스펙','상세스펙','상세 스펙','규격','사양','spec','사이즈','size','규격(mm)'], qty:['수량','개수','qty','ea','수량(ea)'],
  price:['단가','제안단가','제안단가(원)','price','단가(원)'], note:['비고','note','메모','remark'] };
const normH = s => String(s||'').toLowerCase().replace(/[\s()\[\]·_\-]/g,'');
function parseSpecSheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const maps = {}; Object.entries(SPEC_KEYS).forEach(([k,arr]) => arr.forEach(a => maps[normH(a)] = k));
  let hi = -1, cols = {};
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    const c = {}; rows[i].forEach((v,j) => { const k = maps[normH(v)]; if (k && !(k in c)) c[k] = j; });
    if (Object.keys(c).length >= 2 && ('name' in c || 'spec' in c)) { hi = i; cols = c; break; }
  }
  if (hi < 0) throw new Error('머리글(집기명/품목, 규격/스펙, 수량 등)을 찾지 못했습니다. 양식 샘플을 참고해주세요.');
  const g = (r,k) => k in cols ? String(r[cols[k]] ?? '').trim() : '';
  return rows.slice(hi+1).map(r => ({ room: g(r,'room'), code: g(r,'code'), name: g(r,'name'), brand: g(r,'brand'), spec: g(r,'spec'),
    qty: Number(String(g(r,'qty')).replace(/[^\d.\-]/g,''))||0, price: g(r,'price'), note: g(r,'note') })).filter(x => x.name || x.spec || x.code);
}

function uploadSpec(ev, div){
  const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
  if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했습니다.', 'err');
  const date = $('#sp-date').value || today(), title = $('#sp-title').value.trim();
  const r = new FileReader();
  r.onload = async e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const items = parseSpecSheet(wb.Sheets[wb.SheetNames[0]]);
      if (!items.length) return toast('읽어올 항목이 없습니다.', 'warn');
      if (JSON.stringify(items).length > 240000) return toast('항목이 너무 많습니다. 시트를 나눠서 올려주세요.', 'warn');
      const id = await safe(Store.add('spec_snaps', { div, date, title, fileName: file.name, items }), `${items.length}개 항목을 ${date} 회차로 저장했습니다.`);
      if (id) { ui.specSnap[div] = id; saveUi(); render(); }
    } catch(err){ toast(err.message || '엑셀을 읽지 못했습니다.', 'err'); }
  };
  r.readAsArrayBuffer(file);
}

/* 도면 상 집기배치 (편집기) */
let draft = null;   // { key, snapId, div, room, date, memo, drawingId, imageAsset, shapes:[], dirty }

function layoutsOf(div, room){ return S.layouts.filter(l=>l.div===div && l.room===room).sort(byDate); }
function ensureDraft(div){
  const rooms = roomsOf(div);
  let room = (ui.layRoom && (ui.layRoom === '_all' || rooms.some(r=>r.id===ui.layRoom))) ? ui.layRoom : (ui.room !== 'ALL' ? ui.room : (rooms[0]?.id || '_all'));
  if (ui.layRoom !== room) { ui.layRoom = room; saveUi(); }
  const snaps = layoutsOf(div, room);
  const snap = snaps.find(s=>s.id===ui.laySnap) || snaps[snaps.length-1] || null;
  const key = div + '|' + room + '|' + (snap ? snap.id : 'new');
  if (draft && draft.dirty && draft.div === div && draft.room === room) return draft;
  if (!draft || draft.key !== key || (!draft.dirty && snap && draft.version !== (snap.updatedAt||snap.createdAt))) {
    const latestDw = S.drawings.filter(d=>d.div===div && (d.room===room) && d.imageAsset).sort(byDate).pop();
    draft = snap ? { key, snapId: snap.id, div, room, date: snap.date, memo: snap.memo||'', drawingId: snap.drawingId||'', imageAsset: snap.imageAsset||'', shapes: JSON.parse(JSON.stringify(snap.shapes||[])), dirty: false, version: snap.updatedAt||snap.createdAt }
                 : { key, snapId: null, div, room, date: today(), memo: '', drawingId: latestDw?.id||'', imageAsset: latestDw?.imageAsset||'', shapes: [], dirty: false };
    if (selShape && !draft.shapes.some(s=>s.id===selShape)) selShape = null;
  }
  return draft;
}

async function layoutGuard(){ return !draft || !draft.dirty || await confirmBox('저장하지 않은 배치 변경이 있습니다. 버리고 이동할까요?', '버리고 이동'); }
async function layRoom(v){ if (!await layoutGuard()) return render(); draft = null; selShape = null; go({ layRoom: v, laySnap: '' }); }
async function laySnap(id){ if (!await layoutGuard()) return; draft = null; selShape = null; go({ laySnap: id }); }
async function layNew(){ if (!await layoutGuard()) return; const prev = draft; draft = null; ui.laySnap = '__new'; saveUi();
  ensureDraft(ui.div); if (prev && prev.shapes.length && prev.room === draft.room) { draft.shapes = JSON.parse(JSON.stringify(prev.shapes)).map(s=>Object.assign(s,{id:uid()})); draft.drawingId = prev.drawingId; draft.imageAsset = prev.imageAsset; draft.dirty = true; toast('직전 배치를 복사해 새 배치도를 시작합니다. 기준일 확인 후 저장하세요.'); }
  render(); }
function layDiscard(){ draft = null; selShape = null; render(); }
function layDrawing(id){ const dw = S.drawings.find(x=>x.id===id); if (!draft) return; draft.drawingId = id || ''; draft.imageAsset = dw?.imageAsset || ''; draft.dirty = true; render(); }
function laySet(f, v, rr){ const s = draft?.shapes.find(x=>x.id===selShape); if (!s) return; s[f] = v; draft.dirty = true;
  const el = document.querySelector(`.shp[data-id="${s.id}"] .lb`); if (el && !rr) el.innerHTML = `${esc(s.name||'(이름 없음)')} × ${esc(s.qty)}${s.spec?`<small>${esc(s.spec)}</small>`:''}`; if (rr) render(); else { const p = document.querySelector('.ph .dirty'); if (!p) setTimeout(render, 600); } }
function layLinkFx(fid){ const s = draft?.shapes.find(x=>x.id===selShape), f = S.fixtures.find(x=>x.id===fid); if (!s) return; s.fixtureId = fid || ''; if (f) { s.name = f.name; s.qty = Number(f.qty)||0; if (!s.spec) s.spec = f.request || ''; } draft.dirty = true; render(); }
function layDelShape(){ if (!draft) return; draft.shapes = draft.shapes.filter(x=>x.id!==selShape); selShape = null; draft.dirty = true; render(); }
async function saveLayout(){
  const d = draft; if (!d) return; if (!d.imageAsset) return toast('바탕 도면을 먼저 선택하세요.', 'warn');
  const date = d.date || today();
  const data = { div: d.div, room: d.room, date, memo: d.memo, drawingId: d.drawingId, imageAsset: d.imageAsset, shapes: d.shapes, updatedAt: Date.now() };
  const cur = d.snapId ? S.layouts.find(s=>s.id===d.snapId) : null;
  if (cur && cur.date === date) { await safe(Store.put('layouts', cur.id, Object.assign({ createdAt: cur.createdAt }, data)), `${date} 배치도를 저장했습니다.`); draft.dirty = false; draft.version = data.updatedAt; }
  else { const same = S.layouts.find(s=>s.div===d.div && s.room===d.room && s.date===date);
    if (same) { if (!await confirmBox(`${date} 날짜의 배치도가 이미 있습니다. 덮어쓸까요?`, '덮어쓰기')) return;
      await safe(Store.put('layouts', same.id, Object.assign({ createdAt: same.createdAt }, data)), '덮어써서 저장했습니다.'); draft = null; go({ laySnap: same.id }); return; }
    const id = await safe(Store.add('layouts', data), `${date} 배치도를 새 이력으로 저장했습니다.`); if (id) { draft = null; go({ laySnap: id }); } }

function bindCanvas(){
  const cv = $('#cv'); if (!cv || !draft) return;
  let act = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100, r }; };
  cv.onpointerdown = e => {
    if (e.button !== 0) return;
    const shpEl = e.target.closest('.shp'); const p = pt(e);
    if (shpEl) { const s = draft.shapes.find(x=>x.id===shpEl.dataset.id); selShape = s.id;
      act = { kind: e.target.classList.contains('rs') ? 'resize' : 'move', s, el: shpEl, p0: p, o: { x: s.x, y: s.y, w: s.w, h: s.h } };
      cv.querySelectorAll('.shp').forEach(x=>x.classList.toggle('sel', x===shpEl)); cv.setPointerCapture(e.pointerId); e.preventDefault(); return; }
    if (tool === 'circle') { const ar = p.r.width / p.r.height, w = 4, h = 4 * ar;
      const s = { id: uid(), shape: 'circle', x: clamp(p.x - w/2, 0, 100-w), y: clamp(p.y - h/2, 0, 100-h), w, h, name: '', qty: 1, spec: '' };
      draft.shapes.push(s); selShape = s.id; draft.dirty = true; render(); setTimeout(()=>$('#sh-name')?.focus(), 30); return; }
    if (tool === 'rect') { const g = document.createElement('div'); g.className = 'drawghost'; cv.appendChild(g); act = { kind: 'draw', p0: p, g }; cv.setPointerCapture(e.pointerId); e.preventDefault(); return; }
    selShape = null; render();
  };
  cv.onpointermove = e => { if (!act) return; const p = pt(e);
    if (act.kind === 'draw') { const x = Math.min(act.p0.x, p.x), y = Math.min(act.p0.y, p.y); Object.assign(act.g.style, { left: x+'%', top: y+'%', width: Math.abs(p.x-act.p0.x)+'%', height: Math.abs(p.y-act.p0.y)+'%' }); return; }
    const dx = p.x - act.p0.x, dy = p.y - act.p0.y, s = act.s;
    if (act.kind === 'move') { s.x = clamp(act.o.x + dx, 0, 100 - s.w); s.y = clamp(act.o.y + dy, 0, 100 - s.h); }
    else { s.w = clamp(act.o.w + dx, 1, 100 - s.x); s.h = clamp(act.o.h + dy, 1, 100 - s.y); }
    Object.assign(act.el.style, { left: s.x+'%', top: s.y+'%', width: s.w+'%', height: s.h+'%' }); act.moved = true; };
  cv.onpointerup = e => { if (!act) return; const p = pt(e), a = act; act = null;
    if (a.kind === 'draw') { a.g.remove(); let x = Math.min(a.p0.x, p.x), y = Math.min(a.p0.y, p.y), w = Math.abs(p.x - a.p0.x), h = Math.abs(p.y - a.p0.y);
      if (w < 1.5 || h < 1.5) { w = 8; h = 6; x = clamp(a.p0.x - 4, 0, 92); y = clamp(a.p0.y - 3, 0, 94); }
      const s = { id: uid(), shape: 'rect', x: clamp(x,0,100), y: clamp(y,0,100), w: Math.min(w, 100-x), h: Math.min(h, 100-y), name: '', qty: 1, spec: '' };
      draft.shapes.push(s); selShape = s.id; draft.dirty = true; render(); setTimeout(()=>$('#sh-name')?.focus(), 30); return; }
    if (a.moved) draft.dirty = true; render(); };
}

    const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE';
    const place = async (sl, id, X, Y, BW, BH) => { const src = await assetDataUrl(id); if (!src) return; const { w, h } = await imgSize(src); const sc = Math.min(BW/w, BH/h);
      sl.addImage({ data: src, x: X + (BW - w*sc)/2, y: Y + (BH - h*sc)/2, w: w*sc, h: h*sc }); };
    for (const r of list) {
      const sl = pptx.addSlide();
      sl.addText(`${roomName(r.room)} — ${r.title||'도면 현황'}`, { x: .4, y: .2, w: 12.5, h: .5, fontSize: 20, bold: true, fontFace: 'Malgun Gothic' });
      sl.addText(`기준일 ${r.date}${r.note ? '  |  ' + r.note : ''}`, { x: .4, y: .68, w: 12.5, h: .32, fontSize: 11, color: '5A6478', fontFace: 'Malgun Gothic' });
      sl.addText('도면', { x: .4, y: 1.05, w: 5, h: .3, fontSize: 11, bold: true, color: '273044' });
      if (r.planAsset) await place(sl, r.planAsset, .4, 1.4, 5.4, 5.8);
      sl.addText('렌더링', { x: 6.1, y: 1.05, w: 5, h: .3, fontSize: 11, bold: true, color: '273044' });
      const rs = (r.renders||[]).slice(0,4), n = rs.length, cols = n <= 1 ? 1 : 2, rows = n <= 2 ? 1 : 2;
      for (let i = 0; i < n; i++) { const cw = 6.8/cols, ch = 5.8/rows; await place(sl, rs[i], 6.1 + (i%cols)*cw, 1.4 + Math.floor(i/cols)*ch, cw - .1, ch - .1); }
    }
    await saveFile(`청라돔_${DIVS[div]}_인테리어도면현황_${fileStamp()}.pptx`, await pptx.write({ outputType: 'blob' }));
  } catch(e){ toast('PPT 생성 실패: ' + (e.message||e), 'err'); }
}

/* =========================================================
   전체 렌더 · 페이지(탭) 전환
   ========================================================= */
let ganttScrolled = false;
function goPage(p){
  ui.page = p === 'rr' ? 'rr' : 'ms'; saveUi();
  const h = ui.page === 'rr' ? '#rnr' : '#milestone';
  if (location.hash !== h) history.replaceState(null, '', h);
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const p = location.hash === '#rnr' ? 'rr' : location.hash === '#milestone' ? 'ms' : null; if (p && p !== ui.page) { ui.page = p; saveUi(); render(); } });
if (location.hash === '#rnr') ui.page = 'rr'; else if (location.hash === '#milestone') ui.page = 'ms';

function render(){
  if (!Store.ready) return;
  const list = cats();
  if (ui.cat && !list.some(c=>c.id===ui.cat)) ui.cat = null;
  if (!ui.cat && list.length) ui.cat = list[0].id;
  const c = list.find(x=>x.id===ui.cat);
  const y = window.scrollY, gw = $('#gwrap'), gl = gw ? gw.scrollLeft : null;
  document.querySelectorAll('.pnav button').forEach(b => b.classList.toggle('on', b.dataset.p === ui.page));
  const banner = Store.mode === 'local' ? `<div class="banner">내 컴퓨터용 파일로 열려 있습니다. 입력 내용은 이 브라우저에만 저장되고 다른 사람과 공유되지 않습니다.</div>`
               : (caps.assets ? '' : `<div class="banner">보기 권한으로 열려 있어 도면·이미지 업로드가 꺼져 있습니다. 텍스트 입력은 Contributor 이상이면 가능합니다.</div>`);
  let html = banner;
  if (ui.page === 'rr') html += renderRR();
  else {
    html += renderSummary() + renderFlowPicto() + renderMilestone() + renderCats();
    if (c) html += `<section class="card ws" id="ws">${c.type === 'space' ? renderCheongna(c) : renderGeneral(c)}</section>`;
  }
  $('#app').innerHTML = html;
  const names = new Set(); S.plans.forEach(p => { if (p.lead) names.add(p.lead.trim()); (p.staff||[]).forEach(s => s && names.add(s.trim())); });
  $('#dl-names').innerHTML = [...names].sort().map(n => `<option value="${esc(n)}">`).join('');
  window.scrollTo(0, y);
  const g2 = $('#gwrap');
  if (g2) { if (gl !== null) g2.scrollLeft = gl; else if (!ganttScrolled) { const ms = period(); g2.scrollLeft = Math.max(0, (nowWeekAbs() - ymN(ms[0])*4 - 8) * WK); } ganttScrolled = true; }
  fitBars();
  bindCanvas();
}
function fitBars(){
  document.querySelectorAll('.gb span').forEach(sp => {
    for (const fs of [10.5, 9.5, 8.5]) { sp.style.fontSize = fs + 'px'; if (sp.scrollHeight <= sp.clientHeight + 1 && sp.scrollWidth <= sp.clientWidth + 1) break; }
  });
}
window.addEventListener('beforeunload', e => { if (draft && draft.dirty) { e.preventDefault(); e.returnValue = ''; } });
Store.init();
</script>
